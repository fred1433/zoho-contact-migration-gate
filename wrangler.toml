# Static page served under theaipipe.com/demos/zoho-contact-migration-gate/
name = "zoho-contact-migration-gate-demo"
main = "worker.js"
compatibility_date = "2026-09-01"
workers_dev = false
routes = [
  { pattern = "theaipipe.com/demos/zoho-contact-migration-gate", zone_name = "theaipipe.com" },
  { pattern = "theaipipe.com/demos/zoho-contact-migration-gate/*", zone_name = "theaipipe.com" }
]

[assets]
directory = "./site"
binding = "ASSETS"
html_handling = "auto-trailing-slash"
run_worker_first = true
